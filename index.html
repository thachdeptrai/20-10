<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vũ Trụ 3D - CHÚC MỪNG 20/10</title>
  <style>
    :root {
      --bg1: #070012;
      --bg2: #100024;
      --accent: #ff69b4;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: radial-gradient(ellipse at center, var(--bg2) 0%, var(--bg1) 100%);
      font-family: Inter, Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #container {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #info {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 18px;
      color: rgba(255, 255, 255, 0.85);
      z-index: 40;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 12px;
      border-radius: 10px;
      backdrop-filter: blur(6px);
    }

    /* fullscreen image preview */
    #imgOverlay {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 200;
      background: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #imgOverlay img {
      max-width: 92%;
      max-height: 92%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      border-radius: 12px;
      transform-origin: center center;
    }

    #imgOverlay .closeBtn {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 210;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    /* small guidance */
    #hint {
      position: fixed;
      right: 18px;
      top: 18px;
      z-index: 50;
      color: rgba(255, 255, 255, 0.8);
      background: rgba(0, 0, 0, 0.22);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
    }

    /* orientation hint on small screens */
    #orientation-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      color: white;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      flex-direction: column;
    }

    @media (orientation:portrait) and (max-width:900px) {
      #orientation-warning {
        display: flex;
      }

      #container {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="container">
    <canvas id="three-canvas"></canvas>

    <button id="uploadBtn"></button>
    <button id="debugBtn"></button>
    <input id="imageInput" type="file" accept="image/*" multiple style="display:none" />

    <div id="hint">Kéo để xoay • Cuộn để zoom • Click ảnh để phóng to</div>
    <div id="info">NgocThach gủi lời chúc </div>
    <!-- <div id="info">Text xoay nhanh hơn ảnh — kéo/zoom/pan mượt bằng chuột hoặc touch</div> -->

    <div id="imgOverlay" role="dialog" aria-hidden="true">
      <button class="closeBtn">✕ Đóng</button>
      <img id="overlayImg" src="" alt="Preview" />
    </div>

    <div id="orientation-warning">
      <div style="font-size:56px">📱↻</div>
      <h2 style="margin:10px 0 6px">Xoay ngang màn hình để trải nghiệm tốt nhất</h2>
      <p style="opacity:0.85">Chạm để tiếp tục</p>
    </div>
  </div>

  <audio id="bgMusic" loop preload="none">
    <source src="https://cdn.pixabay.com/audio/2022/03/10/audio_4a8bf31cbb.mp3" type="audio/mpeg">
  </audio>

  <!-- Three.js r128 + OrbitControls (non-module) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Fallback OrbitControls if CDN fails
    if (typeof THREE.OrbitControls === 'undefined') {
      console.log('OrbitControls not loaded, creating fallback...');
      // Simple fallback controls
      THREE.OrbitControls = function (camera, domElement) {
        this.camera = camera;
        this.domElement = domElement;
        this.enableDamping = true;
        this.dampingFactor = 0.08;
        this.rotateSpeed = 0.6;
        this.zoomSpeed = 0.8;
        this.panSpeed = 0.6;
        this.minDistance = 6;
        this.maxDistance = 80;
        this.userIsInteracting = false;
        this.enabled = true;

        this.update = function () {
          // Simple auto-rotation
          this.camera.position.x = Math.cos(Date.now() * 0.0005) * 20;
          this.camera.position.z = Math.sin(Date.now() * 0.0005) * 20;
          this.camera.lookAt(0, 0, 0);
        };

        this.addEventListener = function () { };
      };
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"
    onerror="console.log('OrbitControls CDN failed, using fallback')"></script>

  <script>
    // ====== BASIC SETUP ======
    const container = document.getElementById('container');
    const canvas = document.getElementById('three-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio ? Math.min(window.devicePixelRatio, 2) : 1);
    renderer.shadowMap.enabled = false;
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 6, 18);

    // OrbitControls for smooth interaction (pan/zoom/rotate)
    console.log('Creating OrbitControls...', typeof THREE.OrbitControls);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    console.log('OrbitControls created successfully');
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.rotateSpeed = 0.6;
    controls.zoomSpeed = 0.8;
    controls.panSpeed = 0.6;
    controls.minDistance = 6;
    controls.maxDistance = 80;

    // Light
    const ambient = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambient);

    const p1 = new THREE.PointLight(0xff69b4, 0.9, 100);
    const p2 = new THREE.PointLight(0x9370db, 0.9, 100);
    p1.position.set(10, 10, 10);
    p2.position.set(-10, -5, 10);
    scene.add(p1, p2);

    // Enhanced starfield with more stars and twinkling effect
    (function makeStarfield() {
      const starGeo = new THREE.BufferGeometry();
      const starCount = 1200; // More stars
      const positions = new Float32Array(starCount * 3);
      const colors = new Float32Array(starCount * 3);
      const sizes = new Float32Array(starCount);

      for (let i = 0; i < starCount; i++) {
        const r = 400; // Larger field
        positions[i * 3] = (Math.random() - 0.5) * r;
        positions[i * 3 + 1] = (Math.random() - 0.5) * r * 0.8;
        positions[i * 3 + 2] = (Math.random() - 0.5) * r;

        // Random colors (white to blue-white)
        const colorIntensity = Math.random() * 0.5 + 0.5;
        colors[i * 3] = colorIntensity;     // R
        colors[i * 3 + 1] = colorIntensity;   // G  
        colors[i * 3 + 2] = Math.random() * 0.3 + 0.7; // B (slightly blue)

        // Random sizes
        sizes[i] = Math.random() * 1.5 + 0.3;
      }

      starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      starGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      starGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

      const starMat = new THREE.PointsMaterial({
        size: 1.0,
        transparent: true,
        opacity: 0.8,
        vertexColors: true,
        sizeAttenuation: true
      });
      const stars = new THREE.Points(starGeo, starMat);
      scene.add(stars);

      // Store stars reference for animation
      window.stars = stars;
    })();

    // ====== CENTRAL SPHERE (cầu) ======
    const sphereGeo = new THREE.SphereGeometry(2.2, 64, 64);
    const sphereMat = new THREE.MeshPhongMaterial({
      color: 0xff1493,
      emissive: 0x330033,
      shininess: 60,
      transparent: true,
      opacity: 0.98,
    });
    const sphere = new THREE.Mesh(sphereGeo, sphereMat);
    scene.add(sphere);
    console.log('Sphere created and added to scene');

    // ====== TEXT CIRCULAR (textGroup) ======
    const textGroup = new THREE.Group();
    scene.add(textGroup);

    // Multiple text strings for better distribution
    const TEXT_STRINGS = [
      '20/10 Mừng Chúc',
      'gái xinh lun iu Trang Chúc',
      'gáiiiii xin càng Ngàyy',
      'vẻ vui luôn',
      'xinh cười nụ giữ Luôn',
      'em của ngày mừng Chúc ',
      'em của ngày mừng Chúc ',
    ];
    function makeTextSprite(text, fontSize = 64) {
      // Create a larger, higher quality canvas
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');
      c.width = 2048;
      c.height = 512;
      ctx.clearRect(0, 0, c.width, c.height);

      // Create beautiful gradient background
      const bgGradient = ctx.createRadialGradient(c.width / 2, c.height / 2, 0, c.width / 2, c.height / 2, c.width / 2);
      bgGradient.addColorStop(0, 'rgba(255,105,180,0.1)');
      bgGradient.addColorStop(1, 'rgba(147,112,219,0.05)');
      ctx.fillStyle = bgGradient;
      ctx.fillRect(0, 0, c.width, c.height);

      // Create text gradient
      const textGradient = ctx.createLinearGradient(0, 0, c.width, 0);
      textGradient.addColorStop(0, '#ff69b4');
      textGradient.addColorStop(0.3, '#ff1493');
      textGradient.addColorStop(0.5, '#ffffff');
      textGradient.addColorStop(0.7, '#ffd1e6');
      textGradient.addColorStop(1, '#ff69b4');

      // Add glow effect
      ctx.shadowColor = 'rgba(255,255,255,0.8)';
      ctx.shadowBlur = 30;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;

      ctx.font = `bold ${fontSize}px 'Arial', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = textGradient;

      // Draw text with better spacing
      ctx.fillText(text, c.width / 2, c.height / 2);

      // Add outline for better visibility
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.strokeText(text, c.width / 2, c.height / 2);

      // Reset shadow
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;

      const tex = new THREE.CanvasTexture(c);
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.wrapS = THREE.ClampToEdgeWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.needsUpdate = true;

      // Use Sprite but with proper orientation
      const mat = new THREE.SpriteMaterial({
        map: tex,
        transparent: true,
        depthTest: true,
        alphaTest: 0.1
      });
      const spr = new THREE.Sprite(mat);
      spr.scale.set(6, 1.5, 1);

      return spr;
    }

    function createCircularText() {
      // Create one continuous text string
      const fullText = TEXT_STRINGS.join(' • ');
      const radius = 6.5;

      // Split into smaller chunks for better distribution
      const words = fullText.split(' ');
      const num = words.length;

      for (let i = 0; i < num; i++) {
        const word = words[i].trim();
        if (!word) continue;

        // Use different font sizes for variety
        let fontSize = 72;
        if (word.includes('❤️') || word.includes('🌹') || word.includes('💖') || word.includes('✨') || word.includes('💝') || word.includes('🌺') || word.includes('💕') || word.includes('🎉') || word.includes('🌸')) {
          fontSize = 96; // Larger for emojis
        } else if (word.length > 8) {
          fontSize = 64; // Smaller for long words
        }

        const spr = makeTextSprite(word, fontSize);
        // Start from top and go clockwise - closer spacing for continuous effect
        const angle = (i / num) * Math.PI * 2 - Math.PI / 2; // Start from top (-90 degrees)
        spr.userData = { baseAngle: angle, radius };
        textGroup.add(spr);
      }
    }
    createCircularText();
    console.log('Text group created with', textGroup.children.length, 'text sprites');

    // ====== ASTEROIDS / IMAGE SPRITES GROUP ======
    const asteroidGroup = new THREE.Group();
    scene.add(asteroidGroup);

    // Add small white dots around the scene
    (function addWhiteDots() {
      const dotGroup = new THREE.Group();
      const dotCount = 200;

      for (let i = 0; i < dotCount; i++) {
        const dotGeo = new THREE.SphereGeometry(0.05, 8, 8);
        const dotMat = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: Math.random() * 0.8 + 0.2
        });
        const dot = new THREE.Mesh(dotGeo, dotMat);

        // Random position around the scene
        const radius = Math.random() * 50 + 20;
        const angle = Math.random() * Math.PI * 2;
        dot.position.x = Math.cos(angle) * radius;
        dot.position.y = (Math.random() - 0.5) * 30;
        dot.position.z = Math.sin(angle) * radius;

        // Store for animation
        dot.userData = {
          originalY: dot.position.y,
          speed: Math.random() * 0.02 + 0.01,
          phase: Math.random() * Math.PI * 2
        };

        dotGroup.add(dot);
      }

      scene.add(dotGroup);
      window.whiteDots = dotGroup;
    })();

    // helper: random vector within bounds
    function randVec(scale = 20) {
      return new THREE.Vector3(
        (Math.random() - 0.5) * scale,
        (Math.random() - 0.5) * scale * 0.6,
        (Math.random() - 0.5) * scale
      );
    }

    // create image sprite from url (can be dataURL)
    function createImageSprite(imageUrl, position, options = {}) {
      const loader = new THREE.TextureLoader();
      loader.setCrossOrigin('anonymous');

      loader.load(
        imageUrl,
        (tex) => {
          // Set proper texture settings
          tex.minFilter = THREE.LinearFilter;
          tex.magFilter = THREE.LinearFilter;
          tex.wrapS = THREE.ClampToEdgeWrapping;
          tex.wrapT = THREE.ClampToEdgeWrapping;
          tex.needsUpdate = true;

          const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
          const spr = new THREE.Sprite(mat);

          // adapt scale by image aspect
          const aspect = (tex.image && tex.image.width && tex.image.height) ? tex.image.width / tex.image.height : 1;
          const baseSize = options.size || 1.8;
          spr.scale.set(baseSize * aspect, baseSize, 1);

          spr.position.copy(position);
          // userData for motion
          spr.userData = {
            velocity: new THREE.Vector3(
              (Math.random() - 0.5) * 0.008,
              (Math.random() - 0.5) * 0.008,
              (Math.random() - 0.5) * 0.008
            ),
            orbitSpeed: (Math.random() * 0.6 + 0.2) * 0.002, // slower orbit
            rotationSpeed: (Math.random() - 0.5) * 0.003, // slow spin
            baseRadius: spr.position.length(),
            clickable: true,
            source: imageUrl,
            texture: tex,
            material: mat
          };

          asteroidGroup.add(spr);
        },
        undefined,
        (err) => {
          console.warn('Texture load failed for:', imageUrl, err);
          // Create a fallback sprite with a colored square
          createFallbackSprite(position, options);
        }
      );
    }

    // Create fallback sprite when image loading fails
    function createFallbackSprite(position, options = {}) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Create a beautiful gradient background
      const gradient = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
      gradient.addColorStop(0, '#ff69b4');
      gradient.addColorStop(0.7, '#ff1493');
      gradient.addColorStop(1, '#9370db');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 512, 512);

      // Add subtle inner glow
      const innerGradient = ctx.createRadialGradient(256, 256, 0, 256, 256, 150);
      innerGradient.addColorStop(0, 'rgba(255,255,255,0.2)');
      innerGradient.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = innerGradient;
      ctx.fillRect(0, 0, 512, 512);

      // Add emoji with shadow
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 2;
      ctx.fillStyle = 'white';
      ctx.font = 'bold 120px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('📷', 256, 256);

      // Reset shadow
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;

      const tex = new THREE.CanvasTexture(canvas);
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.wrapS = THREE.ClampToEdgeWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.needsUpdate = true;

      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const spr = new THREE.Sprite(mat);

      const baseSize = options.size || 1.8;
      spr.scale.set(baseSize, baseSize, 1);
      spr.position.copy(position);

      spr.userData = {
        velocity: new THREE.Vector3(
          (Math.random() - 0.5) * 0.008,
          (Math.random() - 0.5) * 0.008,
          (Math.random() - 0.5) * 0.008
        ),
        orbitSpeed: (Math.random() * 0.6 + 0.2) * 0.002,
        rotationSpeed: (Math.random() - 0.5) * 0.003,
        baseRadius: spr.position.length(),
        clickable: true,
        source: 'fallback',
        texture: tex,
        material: mat
      };

      asteroidGroup.add(spr);
    }

    // Helper function to create beautiful sample image data URLs
    function createSampleImageDataURL(color, emoji) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Create beautiful gradient background
      const gradient = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
      gradient.addColorStop(0, color);
      gradient.addColorStop(0.7, adjustColor(color, -20));
      gradient.addColorStop(1, adjustColor(color, -40));

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 512, 512);

      // Add subtle inner glow
      const innerGradient = ctx.createRadialGradient(256, 256, 0, 256, 256, 150);
      innerGradient.addColorStop(0, 'rgba(255,255,255,0.3)');
      innerGradient.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = innerGradient;
      ctx.fillRect(0, 0, 512, 512);

      // Add emoji with shadow
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 2;
      ctx.fillStyle = 'white';
      ctx.font = 'bold 140px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(emoji, 256, 256);

      // Reset shadow
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;

      return canvas.toDataURL('image/png');
    }

    function adjustColor(color, amount) {
      const num = parseInt(color.replace("#", ""), 16);
      const r = Math.max(0, Math.min(255, ((num >> 16) & 255) + amount));
      const g = Math.max(0, Math.min(255, ((num >> 8) & 255) + amount));
      const b = Math.max(0, Math.min(255, (num & 255) + amount));
      return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
    }

    // Function to load images from upload folder
    async function loadImagesFromUpload() {
      try {
        const imageFiles = [];
        for (let i = 1; i <= 10; i++) {
          for (let j = 0; j < 20; j++) {  // mỗi ảnh nhét 20 lần
            imageFiles.push(`upload/image${i}.jpg`);
          }
        }



        const loadedImages = [];

        for (const imagePath of imageFiles) {
          try {
            const img = new Image();
            img.crossOrigin = 'anonymous';

            await new Promise((resolve, reject) => {
              img.onload = () => {
                loadedImages.push(imagePath);
                resolve();
              };
              img.onerror = () => reject();
              img.src = imagePath;
            });
          } catch (e) {
            console.log(`Image not found: ${imagePath}`);
          }
        }
        // === NHÂN ẢNH LÊN 100 LẦN Ở ĐÂY ===
        const expandedImages = [];
        for (let i = 0; i < 100; i++) {
          expandedImages.push(...loadedImages);
        }
        return expandedImages;

      } catch (error) {
        console.log('No images found in upload folder, using fallback');
        return [];
      }

    }


    // Create sample images array (fallback)
    const fallbackImages = [
      createSampleImageDataURL('#ff69b4', '❤️'),
      createSampleImageDataURL('#9370db', '🌹'),
      createSampleImageDataURL('#ff1493', '💖'),
      createSampleImageDataURL('#ffd700', '✨'),
      createSampleImageDataURL('#ff6347', '💝'),
      createSampleImageDataURL('#32cd32', '🌺')
    ];

    // Create initial sprites after loading images from upload folder
    setTimeout(async () => {
      console.log('Loading images from upload folder...');
      const uploadImages = await loadImagesFromUpload();
      const sampleImages = uploadImages.length > 0 ? uploadImages : fallbackImages;

      console.log('Creating initial sprites...');
      for (let i = 0; i < 32; i++) { // Reduced number of sprites
        const pos = randVec(28);
        const src = sampleImages[Math.floor(Math.random() * sampleImages.length)];
        createImageSprite(src, pos, { size: 1.8 }); // Smaller size
      }
      console.log('Initial sprites created:', asteroidGroup.children.length);
    }, 100);

    // ====== UPLOAD HANDLING: on upload, create multiple clones of uploaded file ======
    const uploadBtn = document.getElementById('uploadBtn');
    const debugBtn = document.getElementById('debugBtn');
    const imageInput = document.getElementById('imageInput');
    uploadBtn.addEventListener('click', () => imageInput.click());

    debugBtn.addEventListener('click', () => {
      console.log('=== DEBUG INFO ===');
      console.log('Scene children:', scene.children.length);
      console.log('Sphere exists:', !!sphere);
      console.log('Text group children:', textGroup.children.length);
      console.log('Asteroid group children:', asteroidGroup.children.length);
      console.log('Camera position:', camera.position);
      console.log('Camera rotation:', camera.rotation);
      console.log('Renderer size:', renderer.getSize(new THREE.Vector2()));
      console.log('Canvas size:', canvas.width, 'x', canvas.height);

      // Force create some test sprites
      console.log('Creating test sprites...');
      const testImages = fallbackImages; // Use fallback for debug
      for (let i = 0; i < 3; i++) {
        const pos = randVec(10);
        createImageSprite(testImages[0], pos, { size: 1.5 });
      }
      console.log('Test sprites created. Total asteroids:', asteroidGroup.children.length);
    });

    imageInput.addEventListener('change', (ev) => {
      const files = Array.from(ev.target.files || []);
      if (!files.length) return;
      const maxFiles = 8; // avoid DoS
      const useFiles = files.slice(0, maxFiles);

      useFiles.forEach((file) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          // create N clones distributed around
          const clones = 6; // Reduced number of clones
          for (let k = 0; k < clones; k++) {
            const pos = randVec(24);
            // slightly offset radius to make circular patterns
            pos.applyAxisAngle(new THREE.Vector3(0, 1, 0), (k / clones) * Math.PI * 2);
            createImageSprite(e.target.result, pos, { size: 1.6 }); // Smaller size
          }
        };
        reader.readAsDataURL(file);
      });

      // clear input so same file can be uploaded again later
      imageInput.value = '';
    });

    // ====== RAYCASTER FOR CLICK / TOUCH to open overlay ======
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const overlay = document.getElementById('imgOverlay');
    const overlayImg = document.getElementById('overlayImg');
    const closeBtn = document.querySelector('#imgOverlay .closeBtn');

    function onPointerDown(event) {
      // Prevent default to avoid conflicts
      event.preventDefault();

      // normalize pointer
      const rect = renderer.domElement.getBoundingClientRect();
      let clientX, clientY;
      if (event.touches && event.touches.length) {
        clientX = event.touches[0].clientX;
        clientY = event.touches[0].clientY;
      } else {
        clientX = event.clientX;
        clientY = event.clientY;
      }
      pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = - ((clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const intersects = raycaster.intersectObjects(asteroidGroup.children, true);
      if (intersects.length) {
        const obj = intersects[0].object;
        if (obj && obj.userData && obj.userData.source && obj.userData.source !== 'fallback') {
          // open overlay with image
          overlayImg.src = obj.userData.source;
          overlay.style.display = 'flex';
          overlay.setAttribute('aria-hidden', 'false');

          // pause controls damping slightly
          controls.enabled = false;
        }
      }
    }

    // Add both pointer and touch events for better mobile support
    renderer.domElement.addEventListener('pointerdown', onPointerDown, { passive: false });
    renderer.domElement.addEventListener('touchstart', onPointerDown, { passive: false });

    closeBtn.addEventListener('click', () => {
      overlay.style.display = 'none';
      overlay.setAttribute('aria-hidden', 'true');
      overlayImg.src = '';
      controls.enabled = true;
    });

    // also close overlay when background clicked
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) {
        closeBtn.click();
      }
    });

    // autoplay music on first interaction with better error handling
    const music = document.getElementById('bgMusic');
    let musicStarted = false;

    function startMusic() {
      if (musicStarted) return;
      musicStarted = true;

      music.play().then(() => {
        console.log('Music started successfully');
      }).catch((error) => {
        console.warn('Music autoplay failed:', error);
        // Show a button to manually start music
        showMusicButton();
      });
    }

    function showMusicButton() {
      const musicBtn = document.createElement('button');
      musicBtn.innerHTML = '🎵 Phát nhạc';
      musicBtn.style.cssText = `
        position: fixed;
        top: 60px;
        left: 18px;
        z-index: 50;
        background: linear-gradient(135deg, #ff69b4 0%, #9370db 100%);
        color: white;
        border: none;
        padding: 10px 14px;
        border-radius: 8px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.45);
        cursor: pointer;
        font-weight: 600;
      `;
      musicBtn.addEventListener('click', () => {
        music.play().catch(() => { });
        musicBtn.remove();
      });
      document.body.appendChild(musicBtn);
    }

    // Start music on any user interaction
    document.addEventListener('click', startMusic, { once: true });
    document.addEventListener('touchstart', startMusic, { once: true });
    document.addEventListener('keydown', startMusic, { once: true });

    // ====== ANIMATION ======
    let clock = new THREE.Clock();
    let t = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      t += dt;

      // slow auto-rotate the whole scene slightly when not interacting
      if (!controls.userIsInteracting) {
        controls.autoRotate = false; // not using built-in autoRotate to keep control
      }
      controls.update();

      // Debug: log scene objects every 5 seconds
      if (Math.floor(t) % 5 === 0 && Math.floor(t) !== Math.floor(t - dt)) {
        console.log('Scene objects:', {
          sphere: sphere ? 'exists' : 'missing',
          textGroup: textGroup.children.length,
          asteroidGroup: asteroidGroup.children.length,
          totalObjects: scene.children.length
        });
      }

      // rotate sphere gently (breathing)
      sphere.rotation.y += dt * 0.12;
      sphere.rotation.x = Math.sin(t * 0.3) * 0.02;

      // TEXT: rotate around center clockwise creating continuous circle
      textGroup.children.forEach((spr) => {
        const ud = spr.userData;
        ud.baseAngle += dt * 0.2; // Slower rotation for better readability
        const x = Math.cos(ud.baseAngle) * ud.radius;
        const z = Math.sin(ud.baseAngle) * ud.radius;
        spr.position.set(x, 0, z);

        // Make sprite face camera properly
        spr.lookAt(camera.position);

        // Text orientation - negative scale to fix reading direction
        spr.scale.x = -6; // Negative to fix reading direction
        spr.scale.y = 1.5;
        spr.scale.z = 1;
      });

      // ASTEROIDS / IMAGES: orbit slowly, spin slowly, keep facing camera (sprite does by default)
      asteroidGroup.children.forEach((a, idx) => {
        const ud = a.userData;
        if (!ud) return;
        // orbit around origin slowly
        const ang = Math.atan2(a.position.z, a.position.x);
        const newAng = ang + ud.orbitSpeed;
        const r = Math.max(3, Math.sqrt(a.position.x * a.position.x + a.position.z * a.position.z));
        a.position.x = Math.cos(newAng) * r;
        a.position.z = Math.sin(newAng) * r;

        // gentle bobbing in Y
        a.position.y += Math.sin(t * 0.7 + idx) * 0.0008;

        // spin (since sprites don't rotate in 3D, rotate the material map)
        a.material.rotation = (a.material.rotation || 0) + ud.rotationSpeed;

        // keep within bounds
        if (a.position.length() > 120) {
          a.position.multiplyScalar(0.95);
        }
      });

      // subtle light motion
      p1.position.x = Math.sin(t * 0.6) * 12;
      p1.position.z = Math.cos(t * 0.6) * 12;
      p2.position.x = Math.cos(t * 0.9) * 10;
      p2.position.z = Math.sin(t * 0.9) * 10;

      // Twinkling stars effect
      if (window.stars) {
        const starPositions = window.stars.geometry.attributes.position.array;
        const starColors = window.stars.geometry.attributes.color.array;

        for (let i = 0; i < starPositions.length; i += 3) {
          // Twinkling effect based on position
          const twinkle = Math.sin(t * 2 + starPositions[i] * 0.01) * 0.3 + 0.7;
          starColors[i] = twinkle;     // R
          starColors[i + 1] = twinkle;   // G
          starColors[i + 2] = twinkle * 0.8 + 0.2; // B (slightly blue)
        }
        window.stars.geometry.attributes.color.needsUpdate = true;
      }

      // Animate white dots
      if (window.whiteDots) {
        window.whiteDots.children.forEach((dot) => {
          const ud = dot.userData;
          // Gentle floating motion
          dot.position.y = ud.originalY + Math.sin(t * ud.speed + ud.phase) * 2;
          // Slow rotation around center
          const angle = t * 0.1 + ud.phase;
          const radius = Math.sqrt(dot.position.x * dot.position.x + dot.position.z * dot.position.z);
          dot.position.x = Math.cos(angle) * radius;
          dot.position.z = Math.sin(angle) * radius;
        });
      }

      renderer.render(scene, camera);
    }
    animate();

    // ====== resize ======
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ====== small polish: prevent accidental text selection while dragging ======
    renderer.domElement.style.touchAction = 'none';
    renderer.domElement.style.userSelect = 'none';
    renderer.domElement.style.webkitUserSelect = 'none';
    renderer.domElement.style.mozUserSelect = 'none';
    renderer.domElement.style.msUserSelect = 'none';

    // ====== minor improvements for controls UX ======
    // detect user interaction state to optionally pause auto movement (simple)
    controls.addEventListener('start', () => controls.userIsInteracting = true);
    controls.addEventListener('end', () => { controls.userIsInteracting = false; });

    // ====== Accessibility: keyboard to close overlay ======
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlay.style.display === 'flex') {
        closeBtn.click();
      }
    });

    // ====== Prevent runaway memory: limit asteroidGroup size by pruning oldest when too many ======
    const MAX_SPRITES = 180;
    function pruneIfNeeded() {
      while (asteroidGroup.children.length > MAX_SPRITES) {
        const rem = asteroidGroup.children.shift();
        if (rem && rem.userData) {
          // Dispose texture and material properly
          if (rem.userData.texture) {
            rem.userData.texture.dispose();
          }
          if (rem.userData.material) {
            rem.userData.material.dispose();
          }
        }
        if (rem && rem.material) {
          if (rem.material.map) rem.material.map.dispose();
          rem.material.dispose();
        }
        if (rem && rem.geometry) rem.geometry.dispose();
      }
    }
    // call periodically
    setInterval(pruneIfNeeded, 3000);

    // small helper: allow dropping files onto canvas
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      const dt = e.dataTransfer;
      if (dt && dt.files && dt.files.length) {
        imageInput.files = dt.files;
        imageInput.dispatchEvent(new Event('change'));
      }
    });

  </script>
</body>
